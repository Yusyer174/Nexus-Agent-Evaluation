spec:
  inputs:
    run_gpu_smoke:
      type: string
      default: "no"
      options: ["no", "diagnostics"]
      description: "Run only the bounded CUDA driver diagnostic; no model download."
---
stages:
  - test

variables:
  NEXUS_RUN_GPU_SMOKE: $[[ inputs.run_gpu_smoke ]]

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == "experiment/gpu-capability-probe" && $NEXUS_RUN_GPU_SMOKE == "diagnostics"'
    - when: never

cuda-diagnostics:
  stage: test
  image: nvcr.io/nvidia/cuda:12.1.1-base-ubuntu22.04
  tags:
    - saas-linux-medium-amd64-gpu-standard
  timeout: 5m
  variables:
    GIT_STRATEGY: clone
    NVIDIA_DRIVER_CAPABILITIES: compute,utility
  script:
    - test '$[[ inputs.run_gpu_smoke ]]' = diagnostics
    - apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3 util-linux
    - |
      set -eu
      ls -l /dev/nvidia* 2>/dev/null || true
      if command -v nvidia-smi >/dev/null 2>&1; then
        nvidia-smi --query-gpu=name,memory.total,driver_version --format=csv,noheader || true
      fi
      ldconfig -p | grep -E 'libcuda\\.so|libnvidia-ml\\.so' || true
      install -d -m 0700 -o nobody -g nogroup /tmp/nexus-cuda-check
      install -m 0444 tools/cuda_driver_probe.py /tmp/nexus-cuda-check/
      runuser -u nobody -- env -i HOME=/tmp/nexus-cuda-check PATH=/usr/bin:/bin LD_LIBRARY_PATH=/usr/local/nvidia/lib64:/usr/local/nvidia/lib:/usr/lib/x86_64-linux-gnu timeout 45s python3 /tmp/nexus-cuda-check/cuda_driver_probe.py > cuda-driver-report.json || result=$?
      cat cuda-driver-report.json
      exit "${result:-0}"
  artifacts:
    when: always
    paths:
      - cuda-driver-report.json
    expire_in: 1 week

# Model benchmark retained for reference but disabled until CUDA diagnosis succeeds.
.model-smoke:
  stage: test
  image:
    name: ollama/ollama:0.40.18@sha256:1cabd20e1762a7a8444bf4a7110b346d923cd77ab6c97c984434140638c913ec
    entrypoint: [""]
  tags:
    - saas-linux-medium-amd64-gpu-standard
  timeout: 20m
  variables:
    GIT_STRATEGY: clone
  script:
    - test '$[[ inputs.run_gpu_smoke ]]' = yes
    - apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3 util-linux
    - |
      if command -v nvidia-smi >/dev/null 2>&1; then
        nvidia-smi --query-gpu=name,memory.total,driver_version --format=csv,noheader || echo "Optional NVIDIA telemetry unavailable"
      else
        echo "nvidia-smi absent in the container; GPU use will be checked via Ollama API"
      fi
      ls -l /dev/nvidia* 2>/dev/null || echo "No NVIDIA device nodes visible in diagnostic listing"
      ldconfig -p 2>/dev/null | grep -E 'libcuda\.so|libnvidia-ml\.so' || true
    - install -d -m 0700 -o nobody -g nogroup /tmp/nexus-model
    - install -m 0444 evaluator.py tools/gpu_model_smoke.py /tmp/nexus-model/
    - |
      set -eu
      local_run() {
        runuser -u nobody -- env -i HOME=/tmp/nexus-model PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin OLLAMA_HOST=127.0.0.1:11434 OLLAMA_MODELS=/tmp/nexus-model/models OLLAMA_NO_CLOUD=1 "$@"
      }
      local_run python3 /tmp/nexus-model/gpu_model_smoke.py --self-test
      local_run ollama serve >/tmp/nexus-ollama.log 2>&1 &
      server_pid=$!
      trap 'kill "$server_pid" 2>/dev/null || true' EXIT
      local_run python3 /tmp/nexus-model/gpu_model_smoke.py --ready
      local_run timeout 480s ollama pull qwen2.5-coder:7b
      cd /tmp/nexus-model
      result=0
      local_run timeout 360s python3 gpu_model_smoke.py --run || result=$?
      if test -f model-smoke-report.json; then
        install -m 0644 model-smoke-report.json "$CI_PROJECT_DIR/model-smoke-report.json"
      fi
      exit "$result"
  artifacts:
    when: always
    paths:
      - model-smoke-report.json
    expire_in: 1 week
