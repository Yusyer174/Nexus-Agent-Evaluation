workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: never

agent-smoke:
  image:
    name: ollama/ollama:latest
    entrypoint: [""]
  tags:
    - saas-linux-medium-amd64-gpu-standard
  timeout: 20m
  variables:
    GIT_STRATEGY: none
  script:
    - apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq curl ca-certificates git python3 nodejs npm util-linux
    - npm install --global @opencode/cli
    - install -d -m 0777 /tmp/nexus-agent /tmp/nexus-work
    - curl -fsSL https://github.com/Yusyer174/Nexus-Agent-Evaluation/archive/95914a9f89b317853d12c6deea83d6f231fcf74d.tar.gz | tar -xz -C /tmp/nexus-work --strip-components=1
    - chown -R nobody:nogroup /tmp/nexus-work /tmp/nexus-agent
    - env -i HOME=/tmp/nexus-agent PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin OLLAMA_HOST=127.0.0.1:11434 ollama serve > /tmp/nexus-ollama.log 2>&1 &
    - sleep 5
    - env -i HOME=/tmp/nexus-agent PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin OLLAMA_HOST=127.0.0.1:11434 ollama pull qwen2.5-coder:7b
    - nvidia-smi --query-gpu=name,memory.total --format=csv,noheader
    - |
      cd /tmp/nexus-work
      runuser -u nobody -- env -i HOME=/tmp/nexus-agent PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin OLLAMA_HOST=127.0.0.1:11434 timeout 420s opencode run --standalone --model ollama/qwen2.5-coder:7b "Inspect evaluator.py. Create only tests/test_agent_generated.py with Python unittest tests for _unique_object: unique keys keep values, duplicate keys raise ValueError, empty input returns an empty dict. Do not change any other file or run network commands. Explain what you changed." || echo "AGENT_EXECUTION_FAILED"
      if test -f tests/test_agent_generated.py; then
        python3 -m unittest tests.test_agent_generated || python3 -m unittest discover -s tests -p test_agent_generated.py
      else
        echo "AGENT_DID_NOT_CREATE_TEST"
        exit 1
      fi
    - cp /tmp/nexus-work/tests/test_agent_generated.py "$CI_PROJECT_DIR/generated-test.py"
  artifacts:
    when: always
    paths:
      - generated-test.py
    expire_in: 1 week
