[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-agent-evaluation"
version = "0.3.0rc1"
description = "Deterministic evaluation of structured AI-agent decisions"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []
keywords = ["ai-agents", "evaluation", "testing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Repository = "https://github.com/Yusyer174/Nexus-Agent-Evaluation"
Issues = "https://github.com/Yusyer174/Nexus-Agent-Evaluation/issues"

[project.scripts]
nexus-evaluate = "evaluator:main"

[tool.setuptools]
py-modules = ["evaluator"]
