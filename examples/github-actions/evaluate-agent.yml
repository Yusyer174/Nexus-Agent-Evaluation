# Copy to the calling project's .github/workflows/evaluate-agent.yml.
# Prototype example pinned to a tested commit. Review changes before updating it.
name: Evaluate agent declarations
on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Node 24 requires Actions Runner 2.327.1+ on self-hosted runners.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      # The caller repository must provide its own cases.json and predictions.json.
      # For example, have a previous step generate declared agent outputs.
      - name: Check reported agent decisions
        uses: Yusyer174/Nexus-Agent-Evaluation@754dcf51ff4fb5b15a648d4f633b55ee5fe0a3f7
        with:
          cases: tests/agent/cases.json
          predictions: tests/agent/predictions.json
          min-pass-rate: "1.0"
          report-path: agent-evaluation-report.json
      - name: Upload report when available
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-evaluation-report
          path: agent-evaluation-report.json
          if-no-files-found: ignore
