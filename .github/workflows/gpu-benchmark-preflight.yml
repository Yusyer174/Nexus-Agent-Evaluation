name: GPU benchmark preflight

on:
  push:
    branches: [experiment/gpu-capability-probe]

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.10'
      - name: Compile benchmark and evaluator
        run: python -m py_compile tools/gpu_model_smoke.py tools/cuda_driver_probe.py tools/coding_benchmark.py tools/patch_benchmark.py evaluator.py
      - name: Check benchmark acceptance and rejection cases
        run: PYTHONPATH=. python tools/gpu_model_smoke.py --self-test
      - name: Check coding screening scorer
        run: PYTHONPATH=. python tools/coding_benchmark.py --self-test
      - name: Check patch scorer and language restrictions
        run: PYTHONPATH=. python tools/patch_benchmark.py --self-test
      - name: Run existing evaluator tests
        run: python -m unittest discover -s tests -v
