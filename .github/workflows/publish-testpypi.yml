name: TestPyPI candidate 0.3.0rc1

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Upload the pinned candidate to TestPyPI (false = verification only)'
        type: boolean
        default: false
        required: true

permissions: {}

concurrency:
  group: nexus-testpypi-0.3.0rc1
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'Yusyer174/Nexus-Agent-Evaluation' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
    steps:
      - name: Download exact validated main artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          repository: Yusyer174/Nexus-Agent-Evaluation
          run-id: '45821465252'
          artifact-ids: '15116858742'
          merge-multiple: true
          digest-mismatch: error
          path: retained
      - name: Verify the approved candidate bytes
        shell: python
        run: |
          import hashlib
          import json
          from pathlib import Path
          import shutil

          root = Path("retained")
          expected = {
              "nexus_agent_evaluation-0.3.0rc1-py3-none-any.whl": "4934d87588ba4deb2fdf20d5e59ffeca9b5a13f15c364da6f03ee04da94216ad",
              "nexus_agent_evaluation-0.3.0rc1.tar.gz": "2d9498cd797428d5292a803a943dd50a1e92d76cbe8d23b2199f76294996d808",
          }
          extras = {"SHA256SUMS", "build-details-a.json", "build-details-b.json"}
          if {p.name for p in root.iterdir()} != set(expected) | extras:
              raise ValueError("Unexpected retained artifact contents")
          if any(not p.is_file() or p.is_symlink() for p in root.iterdir()):
              raise ValueError("Expected only regular files")
          manifest = "".join(f"{digest}  {name}\n" for name, digest in sorted(expected.items()))
          if (root / "SHA256SUMS").read_text(encoding="ascii") != manifest:
              raise ValueError("Manifest differs from independently recorded hashes")
          for label in ("a", "b"):
              report = json.loads((root / f"build-details-{label}.json").read_text(encoding="utf-8"))
              if report["source_commit"] != "152220b6c90c3fc1e1ce7638a2f17d6a3c68d1c1" or report["sha256"] != expected:
                  raise ValueError("Build report differs from approved source or hashes")
          dist = Path("dist")
          dist.mkdir()
          for name, digest in expected.items():
              source = root / name
              if hashlib.sha256(source.read_bytes()).hexdigest() != digest:
                  raise ValueError(f"Hash mismatch: {name}")
              target = dist / name
              shutil.copyfile(source, target)
              if hashlib.sha256(target.read_bytes()).hexdigest() != digest:
                  raise ValueError(f"Copy mismatch: {name}")
              print(f"{digest}  {name}")

  publish:
    if: inputs.publish == true && github.repository == 'Yusyer174/Nexus-Agent-Evaluation' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: testpypi
    permissions:
      actions: read
      id-token: write
    steps:
      - name: Download exact validated main artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          repository: Yusyer174/Nexus-Agent-Evaluation
          run-id: '45821465252'
          artifact-ids: '15116858742'
          merge-multiple: true
          digest-mismatch: error
          path: retained
      - name: Verify the approved candidate bytes
        shell: python
        run: |
          import hashlib
          import json
          from pathlib import Path
          import shutil

          root = Path("retained")
          expected = {
              "nexus_agent_evaluation-0.3.0rc1-py3-none-any.whl": "4934d87588ba4deb2fdf20d5e59ffeca9b5a13f15c364da6f03ee04da94216ad",
              "nexus_agent_evaluation-0.3.0rc1.tar.gz": "2d9498cd797428d5292a803a943dd50a1e92d76cbe8d23b2199f76294996d808",
          }
          extras = {"SHA256SUMS", "build-details-a.json", "build-details-b.json"}
          if {p.name for p in root.iterdir()} != set(expected) | extras:
              raise ValueError("Unexpected retained artifact contents")
          if any(not p.is_file() or p.is_symlink() for p in root.iterdir()):
              raise ValueError("Expected only regular files")
          manifest = "".join(f"{digest}  {name}\n" for name, digest in sorted(expected.items()))
          if (root / "SHA256SUMS").read_text(encoding="ascii") != manifest:
              raise ValueError("Manifest differs from independently recorded hashes")
          for label in ("a", "b"):
              report = json.loads((root / f"build-details-{label}.json").read_text(encoding="utf-8"))
              if report["source_commit"] != "152220b6c90c3fc1e1ce7638a2f17d6a3c68d1c1" or report["sha256"] != expected:
                  raise ValueError("Build report differs from approved source or hashes")
          dist = Path("dist")
          dist.mkdir()
          for name, digest in expected.items():
              source = root / name
              if hashlib.sha256(source.read_bytes()).hexdigest() != digest:
                  raise ValueError(f"Hash mismatch: {name}")
              target = dist / name
              shutil.copyfile(source, target)
              if hashlib.sha256(target.read_bytes()).hexdigest() != digest:
                  raise ValueError(f"Copy mismatch: {name}")
              print(f"{digest}  {name}")
      - name: Publish the exact candidate to TestPyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          skip-existing: false
          verify-metadata: true
          print-hash: true
