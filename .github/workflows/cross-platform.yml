name: Cross-platform CLI checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cli-portability:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Run evaluator unit and CLI tests
        run: python -m unittest discover -s tests -v
      - name: Verify accepted synthetic fixture
        run: python evaluator.py examples/cases.json examples/predictions.json --output accepted-report.json
      - name: Inspect accepted report
        run: python -c "import json; r=json.load(open('accepted-report.json', encoding='utf-8')); assert r['accepted'] and r['total']==3"
      - name: Validate command-line help
        run: python evaluator.py --help
